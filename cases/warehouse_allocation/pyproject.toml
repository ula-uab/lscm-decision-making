[project]
name = "warehouse-allocation"
version = "0.1.0"
description = "Which warehouse serves each customer: the T1 running example as a package for the notebook (course case, UAB)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pulp>=3.3",
    "highspy>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouses"]
