[project]
name = "supplier-selection"
version = "0.1.0"
description = "Which suppliers to contract and which supplier each component is bought from: decision matrix, buyer's rule, local search and integer model (course case, UAB)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pulp>=3.3",
    "highspy>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suppliers"]
