[project]
name = "production-plan"
version = "0.1.0"
description = "How many bikes each plant assembles each month: linear model, feasible region, shadow prices and a model with no solution (course case, UAB)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pulp>=3.3",
    "highspy>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plants"]
