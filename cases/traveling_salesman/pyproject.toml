[project]
name = "traveling-salesman"
version = "0.1.0"
description = "The round trip of a sales representative through 14 cities: nearest neighbor, sweep, local search with two moves, local optima and the shortest route (course case, UAB)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routes"]
