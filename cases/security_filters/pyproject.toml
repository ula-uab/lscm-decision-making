[project]
name = "security-filters"
version = "0.1.0"
description = "Passengers arriving at airport security filters: presentation curve, queues and scenarios (course case, UAB)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "ipywidgets>=7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_filters"]
