[project]
name = "lscm-decision-making"
version = "0.1.0"
description = "Worked cases and use cases for the courses Decision Making (European Master in Logistics and Supply Chain Management) and Quantitative Methods for Decision Making (bachelor's degree), UAB"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pulp>=3.3",
    "highspy>=1.7",
    "security-filters",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6", "nbconvert>=7", "jupyterlab>=4"]

[tool.uv]
# The repository itself is not a package: it gathers the cases. Cases that
# are packages are workspace members and are installed in the environment.
package = false

[tool.uv.workspace]
members = ["cases/security_filters"]

[tool.uv.sources]
security-filters = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "cases/security_filters/tests"]
addopts = "--import-mode=importlib"
