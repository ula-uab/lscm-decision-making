[project]
name = "lscm-decision-making"
version = "0.1.0"
description = "Worked cases and use cases for the courses Decision Making (European Master in Logistics and Supply Chain Management) and Quantitative Methods for Decision Making (bachelor's degree), UAB"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan José Ramos", email = "juanjose.ramos@uab.es" }]
dependencies = [
    "pulp>=3.3",
    "highspy>=1.7",
    "production-plan",
    "security-filters",
    "supplier-selection",
    "warehouse-allocation",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
    "nbconvert>=7",
    "jupyterlab>=4",
    "nbstripout>=0.9.1",
]

[tool.uv]
# The repository itself is not a package: it gathers the cases. Cases that
# are packages are workspace members and are installed in the environment.
package = false

[tool.uv.workspace]
members = [
    "cases/production_plan",
    "cases/security_filters",
    "cases/supplier_selection",
    "cases/warehouse_allocation",
]

[tool.uv.sources]
production-plan = { workspace = true }
security-filters = { workspace = true }
supplier-selection = { workspace = true }
warehouse-allocation = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "cases/production_plan/tests",
    "cases/security_filters/tests",
    "cases/supplier_selection/tests",
    "cases/warehouse_allocation/tests",
]
addopts = "--import-mode=importlib"
